name: 【deploy】build

on:
  push:
    branches:
      - main

jobs:
  build-bot:
    name: Build Bot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            network=host
            image=moby/buildkit:v0.31.2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push to Container Registry
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: |
            type=gha,scope=bot
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
            type=registry,ref=ghcr.io/${{ github.repository }}:latest
          cache-to: |
            type=gha,scope=bot,mode=max
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          provenance: false
          sbom: false

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [build-bot]
    if: always()
    steps:
      - name: Send Discord notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.NOTIFY_DISCORD_WEBHOOK }}
          title: "🐳 Docker Build Notification"
          description: |
            **Branch**: ${{ github.ref_name }}
            **Author**: ${{ github.actor }}
            **Status**: ${{ (needs.build-bot.result == 'success') && '✅ Docker image built successfully!' || '❌ Docker build failed' }}
          color: ${{ (needs.build-bot.result == 'success') && '3066993' || '15158332' }}
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
