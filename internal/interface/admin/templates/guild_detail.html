{{define "content"}}
<h1>{{.GuildName}}</h1>

<h2>キーワード自動応答</h2>
<p>応答に <code>{$now}</code> と入れると、マッチ時の現在日時（JST）に置き換えて返信します。</p>
<table>
  <tr><th>キーワード</th><th>応答（複数ある場合はランダムに1つ選ばれます）</th><th></th></tr>
  {{range .Keywords}}
  <tr>
    <td>{{.Word}}</td>
    <td>
      <form class="inline" method="post" action="/guilds/{{$.GuildID}}/keywords/update">
        <input type="hidden" name="word" value="{{.Word}}">
        <textarea name="responses" rows="3" required>{{range .Responses}}{{.}}
{{end}}</textarea>
        <button type="submit">保存</button>
      </form>
    </td>
    <td>
      <form class="inline" method="post" action="/guilds/{{$.GuildID}}/keywords/delete">
        <input type="hidden" name="word" value="{{.Word}}">
        <button type="submit">削除</button>
      </form>
    </td>
  </tr>
  {{else}}
  <tr><td colspan="3">登録済みキーワードはありません</td></tr>
  {{end}}
</table>

<form method="post" action="/guilds/{{.GuildID}}/keywords">
  <div class="form-row">
    <label>キーワード <input type="text" name="word" required></label>
  </div>
  <div class="form-row">
    <label>応答 <input type="text" name="response" required></label>
  </div>
  <button type="submit">追加</button>
</form>

<h2>通知先チャンネル</h2>
<table>
  <tr><th>用途</th><th>現在のチャンネル</th></tr>
  <tr><td>俳句検知</td><td>{{.HaikuChannelName}}</td></tr>
  <tr><td>絵文字追加</td><td>{{.EmojiChannelName}}</td></tr>
</table>

<form method="post" action="/guilds/{{.GuildID}}/notify-channels">
  <div class="form-row">
    <label>用途
      <select name="purpose">
        <option value="haiku">俳句検知</option>
        <option value="emoji">絵文字追加</option>
      </select>
    </label>
  </div>
  <div class="form-row">
    <label>チャンネル
      <select name="channel_id">
        {{range .Channels}}
        <option value="{{.ID}}">{{.Name}}</option>
        {{end}}
      </select>
    </label>
  </div>
  <button type="submit">設定</button>
</form>
{{end}}
